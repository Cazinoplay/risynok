<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tablet Preview Editor</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .toolbar { background: #333; padding: 10px; border-radius: 10px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
        
        /* Ключевое свойство для планшетов */
        canvas { 
            background: white; 
            border-radius: 8px; 
            touch-action: none; 
            max-width: 100%; 
            height: auto;
        }
        
        button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="color" id="colorPicker">
    <input type="range" id="sizeSlider" min="1" max="50" value="5">
    <button onclick="setTool('brush')">✏️</button>
    <button onclick="setTool('eraser')">🧹</button>
    <button onclick="clearCanvas()">🗑️</button>
    <button onclick="saveImage()">💾</button>
</div>

<canvas id="canvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let tool = 'brush';

    function setTool(t) { tool = t; }

    function getCoords(e) {
        // Получаем координаты для Touch и Mouse событий
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function start(e) {
        painting = true;
        draw(e);
    }

    function end() {
        painting = false;
        ctx.beginPath();
    }

    function draw(e) {
        if (!painting) return;
        e.preventDefault(); // Запрещает прокрутку
        const pos = getCoords(e);
        
        ctx.lineWidth = document.getElementById('sizeSlider').value;
        ctx.lineCap = 'round';
        ctx.strokeStyle = (tool === 'eraser') ? '#ffffff' : document.getElementById('colorPicker').value;
        
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    // Поддержка мыши
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', end);

    // Поддержка планшетов (Touch)
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', end);

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function saveImage() { 
        const link = document.createElement('a');
        link.download = 'art.png';
        link.href = canvas.toDataURL();
        link.click(); 
    }
</script>
</body>
</html>
