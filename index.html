<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Paint Engine</title>
    <style>
        body { margin: 0; background: #222; display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .toolbar { background: #333; padding: 5px; display: flex; gap: 8px; justify-content: center; color: #aaa; }
        .tool-group { display: flex; flex-direction: column; align-items: center; font-size: 9px; cursor: pointer; }
        canvas { background: white; flex-grow: 1; touch-action: none; cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="tool-group"><button onclick="undo()">↩️</button><span>Отмена</span></div>
    <div class="tool-group"><input type="color" id="colorPicker"><span>Цвет</span></div>
    <div class="tool-group"><input type="range" id="sizeSlider" min="2" max="40" value="5"><span>Толщина</span></div>
    <div class="tool-group"><button onclick="tool='brush'">✏️</button><span>Кисть</span></div>
    <div class="tool-group"><button onclick="tool='eraser'">🧹</button><span>Ластик</span></div>
    <div class="tool-group"><button onclick="saveImage()">💾</button><span>Скачать</span></div>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let tool = 'brush', painting = false;
    let history = []; // Для отмены действий

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 60;
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height); // Белый фон
    }
    window.onload = resize;

    function start(e) {
        painting = true;
        history.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); // Сохраняем состояние
        draw(e);
    }

    function draw(e) {
        if (!painting) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

        ctx.lineWidth = document.getElementById('sizeSlider').value;
        ctx.lineCap = 'round';
        ctx.strokeStyle = (tool === 'eraser') ? 'white' : document.getElementById('colorPicker').value;
        
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function undo() {
        if (history.length > 0) ctx.putImageData(history.pop(), 0, 0);
    }

    function saveImage() {
        const link = document.createElement('a');
        link.download = 'art.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', () => { painting = false; ctx.beginPath(); });
    canvas.addEventListener('touchstart', start);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', () => { painting = false; ctx.beginPath(); });
</script>
</body>
</html>
