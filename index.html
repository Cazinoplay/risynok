<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Preview Editor</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .toolbar { background: white; padding: 15px; border-radius: 12px; display: flex; gap: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        canvas { background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: crosshair; }
        button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="color" id="colorPicker" value="#000000">
    <button onclick="setTool('brush')">Кисть</button>
    <button onclick="setTool('fill')">Заливка</button>
    <button onclick="addText()">Добавить Текст</button>
    <button onclick="clearCanvas()" style="background: #dc3545;">Очистить</button>
</div>

<canvas id="canvas" width="1280" height="720"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let tool = 'brush';

    function setTool(t) { tool = t; }

    canvas.addEventListener('mousedown', (e) => {
        if (tool === 'fill') {
            ctx.fillStyle = document.getElementById('colorPicker').value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            painting = true;
            draw(e);
        }
    });

    canvas.addEventListener('mouseup', () => painting = false);
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
        if (!painting || tool !== 'brush') return;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = document.getElementById('colorPicker').value;
        ctx.lineTo(e.clientX - canvas.offsetLeft, e.clientY - canvas.offsetTop);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - canvas.offsetLeft, e.clientY - canvas.offsetTop);
    }

    function addText() {
        const text = prompt("Введите текст:");
        if (text) {
            ctx.fillStyle = document.getElementById('colorPicker').value;
            ctx.font = "50px Arial";
            ctx.fillText(text, 50, 100);
        }
    }

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
</script>
</body>
</html>
