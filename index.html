<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Эта строка важна: она заставляет страницу подстраиваться под размер экрана планшета -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Пульт</title>
    
    <!-- Добавим немного стилей, чтобы кнопки были удобными -->
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 20px; }
        button { padding: 20px; font-size: 18px; border-radius: 10px; border: none; background: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>Управление ПК</h1>

    <!-- Твои кнопки -->
    <button onclick="sendCommand('click')">Клик мышкой</button>
    <button onclick="sendCommand('vol_up')">Громкость ↑</button>

    <script>
        // Функция отправки команды на твой Python-сервер
        function sendCommand(cmd) {
            // Вставь сюда IP своего ПК (например, 192.168.1.5)
            const ip = "192.168.1.X"; 
            fetch(`http://${ip}:5000/action?cmd=${cmd}`)
                .then(response => console.log('Команда отправлена'))
                .catch(err => alert('Ошибка! Проверь, запущен ли Python-скрипт'));
        }
    </script>
</body>
</html>
